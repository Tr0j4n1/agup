[project]
name = "agup"
version = "1.0.0"
description = "Updater for Antigravity IDE, Hub and CLI, independent of the vendor apt feed"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }

[project.scripts]
agup = "agup.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agup"]
